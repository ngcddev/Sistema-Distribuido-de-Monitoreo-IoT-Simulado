services:

  mysql_mediciones:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_mediciones_data:/var/lib/mysql

  mysql_sensores:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_sensores_data:/var/lib/mysql

  mysql_monitoreo:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_monitoreo_data:/var/lib/mysql

  mediciones:
    build: ./mediciones
    ports:
      - "5001:5001"
    environment:
      DB_HOST: mysql_mediciones
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: mediciones
    depends_on:
      - mysql_mediciones

  sensores:
    build: ./sensores
    ports:
      - "5003:5003"
    environment:
      DB_HOST: mysql_sensores
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: sensores
    depends_on:
      - mysql_sensores

  monitoreo:
    build: ./monitoreo
    ports:
      - "5002:5002"
    environment:
      DB_HOST: mysql_monitoreo
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: monitoreo
      MEDICIONES_URL: http://mediciones:5001
      SENSORES_URL: http://sensores:5003
    depends_on:
      - mysql_monitoreo
      - mediciones
      - sensores

  simulador:
    build: ./simulador
    environment:
      MEDICIONES_URL: http://mediciones:5001
      SENSORES_URL: http://sensores:5003
    depends_on:
      - mediciones
      - sensores

  home:
    build: ./home
    ports:
      - "8080:80"
    depends_on:
      - mediciones
      - monitoreo

volumes:
  mysql_mediciones_data:
  mysql_sensores_data:
  mysql_monitoreo_data:
