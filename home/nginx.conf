server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Home no habla con los microservicios: todas las rutas de datos van al API Gateway (:8000),
    # que identifica el servicio destino y reenvía la petición. Se resuelve el nombre en cada
    # petición para que Nginx arranque aunque el Gateway todavía no exista.
    resolver 127.0.0.11 valid=10s;

    location ~ ^/(sensores|mediciones|monitoreo)(/|$) {
        set $gateway http://gateway:8000;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
}
