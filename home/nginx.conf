server {
    # nginx-unprivileged no puede usar puertos < 1024: escucha en 8080 (Compose publica 8080:8080).
    listen 8080;
    server_tokens off;

    # DNS interno de Docker: resuelve los servicios al atender cada petición, así Nginx
    # arranca aunque un servicio todavía no exista y sigue funcionando si cambia su IP.
    resolver 127.0.0.11 valid=10s;

    # Cabeceras de seguridad. 'unsafe-inline' en estilos mientras la interfaz use style="..."
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1024;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Los estáticos no llevan hash en el nombre: el navegador revalida (ETag) en cada carga.
        # (expires -1 y no add_header: un add_header aquí anularía los del bloque server.)
        expires -1;
    }

    # Coincide con /mediciones y /mediciones/..., pero no con /medicionesXYZ.
    location ~ ^/mediciones(/|$) {
        set $mediciones http://mediciones:5001;
        proxy_pass $mediciones;
        include /etc/nginx/proxy_params.conf;
    }

    location ~ ^/monitoreo(/|$) {
        set $monitoreo http://monitoreo:5002;
        proxy_pass $monitoreo;
        include /etc/nginx/proxy_params.conf;
    }
}
