# Credenciales de administración: 15-credenciales.sh genera este archivo al arrancar el contenedor
# y define $credenciales_ok (1 si la petición trae las credenciales correctas).
include /tmp/credenciales.conf;

# 1 si la petición modifica datos (cualquier método que no sea de solo lectura).
map $request_method $escribe {
    default 1;
    GET     0;
    HEAD    0;
}

# Escribir sin credenciales válidas se deniega ("10" = escribe y no está autenticado).
map "$escribe$credenciales_ok" $denegar {
    default 0;
    "10"    1;
}

server {
    # nginx-unprivileged no puede usar puertos < 1024: escucha en 8080 (Compose publica 8080:8080).
    listen 8080;
    server_tokens off;

    # DNS interno de Docker: resuelve los servicios al atender cada petición, así Nginx
    # arranca aunque un servicio todavía no exista y sigue funcionando si cambia su IP.
    resolver 127.0.0.11 valid=10s;

    # Cabeceras de seguridad. CSP estricta: ni scripts ni estilos en línea (la interfaz usa clases de style.css).
    # Chart.js ajusta el tamaño del <canvas> por CSSOM, que la CSP permite.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1024;

    # Respuesta 401: JSON y el desafío Basic, para que el navegador pida usuario y contraseña.
    error_page 401 = @pedir_credenciales;
    location @pedir_credenciales {
        default_type application/json;
        add_header WWW-Authenticate 'Basic realm="AgroSense admin"' always;
        add_header X-Content-Type-Options "nosniff" always;
        return 401 '{"error": "se requieren credenciales de administrador para modificar datos"}';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Los estáticos no llevan hash en el nombre: el navegador revalida (ETag) en cada carga.
        # (expires -1 y no add_header: un add_header aquí anularía los del bloque server.)
        expires -1;
    }

    # Evaluar un sensor no pide credenciales: es idempotente (una alerta por medición) y solo
    # deriva datos que ya existen. Debe ir antes de la regla general de /monitoreo.
    location ~ ^/monitoreo/evaluar(/|$) {
        set $monitoreo http://monitoreo:5002;
        proxy_pass $monitoreo;
        include /etc/nginx/proxy_params.conf;
    }

    # Coincide con /mediciones y /mediciones/..., pero no con /medicionesXYZ.
    # Consultar es libre; crear, modificar y borrar exige las credenciales de administración.
    location ~ ^/mediciones(/|$) {
        if ($denegar) {
            return 401;
        }
        set $mediciones http://mediciones:5001;
        proxy_pass $mediciones;
        include /etc/nginx/proxy_params.conf;
    }

    location ~ ^/monitoreo(/|$) {
        if ($denegar) {
            return 401;
        }
        set $monitoreo http://monitoreo:5002;
        proxy_pass $monitoreo;
        include /etc/nginx/proxy_params.conf;
    }
}
