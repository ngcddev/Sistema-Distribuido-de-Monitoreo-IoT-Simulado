name: CI

# Se dispara en cada Pull Request hacia main y en cada push a main.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Revisar el código Python
        run: |
          pip install ruff==0.17.4
          ruff check .

  pruebas:
    name: Pruebas de ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [mediciones, monitoreo, sensores, simulador]

    steps:
      - name: Descargar el código del PR
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r ${{ matrix.servicio }}/requirements.txt -r requirements-dev.txt

      - name: Ejecutar pruebas
        working-directory: ${{ matrix.servicio }}
        run: python -m pytest -q

  home:
    name: Pruebas de navegador del Home
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: home/e2e
        run: npm ci

      - name: Ejecutar pruebas (usa el Chrome del runner)
        working-directory: home/e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm test

  compose:
    name: Stack completo con Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del PR
        uses: actions/checkout@v4

      - name: Crear .env desde el ejemplo
        run: |
          cp .env.example .env
          # El purgador revisa cada 5 s (en producción, cada hora) para poder comprobarlo en la prueba de humo
          echo 'PURGA_INTERVALO_SEGUNDOS=5' >> .env

      - name: Verificar que los archivos compose son válidos
        run: docker compose -f compose.yaml -f compose.dev.yaml config -q

      - name: Levantar el stack y esperar a que todo esté saludable
        run: docker compose -f compose.yaml -f compose.dev.yaml up -d --build --wait --wait-timeout 180

      - name: Prueba de humo
        run: |
          curl -fsS localhost:5001/health
          curl -fsS localhost:5002/health
          curl -fsS localhost:5003/health
          curl -fsS localhost:5003/sensores
          # Home debe llegar a las APIs a través del proxy de Nginx
          curl -fsS localhost:8080/ > /dev/null
          curl -fsS localhost:8080/monitoreo/umbrales
          # Escribir exige las credenciales de administración (las de .env.example); consultar es libre
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mediciones \
            -H 'Content-Type: application/json' -d '{"sensor_id": 1, "valor": 99}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -u admin:clave-equivocada localhost:8080/mediciones \
            -H 'Content-Type: application/json' -d '{"sensor_id": 1, "valor": 99}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE localhost:8080/mediciones/1)" = 401
          # Alta de una lectura fuera de rango y evaluación manual
          curl -fsS -X POST -u admin:cambiar-admin localhost:8080/mediciones -H 'Content-Type: application/json' \
            -d '{"sensor_id": 1, "valor": 99, "unidad": "C"}'
          curl -fsS localhost:8080/mediciones/estadisticas
          # La evaluación responde con su resultado (no se exige ALERTA_CRITICA: el simulador
          # inserta lecturas en paralelo y la "última lectura" puede ser otra)
          curl -fsS -X POST localhost:8080/monitoreo/evaluar/1 | grep -q evaluacion
          curl -fsS "localhost:8080/monitoreo/alertas?limit=5" > /dev/null
          # Un sensor que no está en el catálogo se rechaza
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -u admin:cambiar-admin localhost:8080/mediciones \
            -H 'Content-Type: application/json' -d '{"sensor_id": 999, "valor": 1}')" = 400
          # Home sirve Chart.js localmente y con cabeceras de seguridad
          curl -fsS localhost:8080/vendor/chart.umd.min.js > /dev/null
          curl -fsSI localhost:8080/ | grep -qi 'x-content-type-options: nosniff'
          curl -fsSI localhost:8080/ | grep -qi "content-security-policy:.*style-src 'self';"

          # Retención: una lectura de hace 60 días (RETENCION_DIAS=30) debe desaparecer sola
          antigua=$(date -u -d '60 days ago' +%Y-%m-%dT%H:%M:%S+00:00)
          curl -fsS -X POST -u admin:cambiar-admin localhost:8080/mediciones -H 'Content-Type: application/json' \
            -d "{\"sensor_id\": 1, \"valor\": 55.555, \"unidad\": \"C\", \"timestamp\": \"$antigua\"}"
          purgada=0
          for i in $(seq 1 30); do
            if ! curl -fsS 'localhost:8080/mediciones?sensor_id=1&limit=1000' | grep '55\.555' > /dev/null; then purgada=1; break; fi
            sleep 2
          done
          test "$purgada" = 1

          # Alertas automáticas: una lectura fuera de rango debe generar su alerta sin que nadie pulse "Evaluar"
          curl -fsS -X POST -u admin:cambiar-admin localhost:8080/mediciones -H 'Content-Type: application/json' \
            -d '{"sensor_id": 1, "valor": 91.234, "unidad": "C"}'
          alerta=0
          for i in $(seq 1 30); do
            if curl -fsS 'localhost:8080/monitoreo/alertas?limit=200' | grep '91\.234' > /dev/null; then alerta=1; break; fi
            sleep 2
          done
          test "$alerta" = 1

      - name: Mostrar logs si algo falló
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml logs --no-color

      - name: Apagar el stack
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down -v
