name: CI

# Se dispara en cada Pull Request hacia main.
# Ampliar más adelante con "push" a main si lo necesitan.
on:
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    name: Pruebas de ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [mediciones, monitoreo, sensores]

    steps:
      - name: Descargar el código del PR
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r ${{ matrix.servicio }}/requirements.txt -r requirements-dev.txt

      - name: Ejecutar pruebas
        working-directory: ${{ matrix.servicio }}
        run: python -m pytest -q

  compose:
    name: Stack completo con Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del PR
        uses: actions/checkout@v4

      - name: Crear .env desde el ejemplo
        run: cp .env.example .env

      - name: Verificar que los archivos compose son válidos
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Levantar el stack y esperar a que todo esté saludable
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait --wait-timeout 180

      - name: Prueba de humo
        run: |
          curl -fsS localhost:5001/health
          curl -fsS localhost:5002/health
          curl -fsS localhost:5003/health
          curl -fsS localhost:5003/sensores
          # Home debe llegar a las APIs a través del proxy de Nginx
          curl -fsS localhost:8080/ > /dev/null
          curl -fsS localhost:8080/monitoreo/umbrales
          # Alta de una lectura fuera de rango y evaluación manual
          curl -fsS -X POST localhost:8080/mediciones -H 'Content-Type: application/json' \
            -d '{"sensor_id": 1, "valor": 99, "unidad": "C"}'
          curl -fsS localhost:8080/mediciones/estadisticas
          curl -fsS -X POST localhost:8080/monitoreo/evaluar/1 | grep -q ALERTA_CRITICA

      - name: Mostrar logs si algo falló
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color

      - name: Apagar el stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
