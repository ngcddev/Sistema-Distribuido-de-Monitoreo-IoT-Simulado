name: CI

# Se dispara en cada Pull Request hacia main.
# Ampliar más adelante con "push" a main si lo necesitan.
on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validar estructura del proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del PR
        uses: actions/checkout@v4

      - name: Verificar que docker-compose.yml es válido
        run: docker compose config -q

      - name: Placeholder - todavía no hay tests
        run: echo "CI funcionando. Agregar lint/tests cuando el equipo defina el stack."
